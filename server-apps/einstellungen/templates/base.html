<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titel %}Einstellungen{% endblock %} · Futurespin</title>
  <style>
    :root { --blau:#486A8F; --gold:#C19A3E; --rot:#b3261e; --gruen:#2e7d32; }
    * { box-sizing:border-box }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
           background:#f5f6f8; color:#1b1b1b; line-height:1.5 }
    header { background:var(--blau); color:#fff; padding:.9rem 1.25rem;
             display:flex; align-items:center; gap:1rem; flex-wrap:wrap }
    header a { color:#fff; text-decoration:none; opacity:.85; font-size:.9rem }
    header a:hover { opacity:1 }
    header .marke { font-weight:700; font-size:1.05rem; margin-right:auto }
    main { max-width:900px; margin:0 auto; padding:1.5rem 1.25rem 4rem }
    h1 { font-size:1.4rem; margin:0 0 1rem }
    h2 { font-size:1.05rem; margin:1.75rem 0 .6rem }
    .karte { background:#fff; border:1px solid #e3e6ea; border-radius:10px;
             padding:1rem 1.15rem; margin-bottom:1rem }
    .karte h3 { margin:0 0 .35rem; font-size:1rem }
    .meta { color:#666; font-size:.85rem }
    table { border-collapse:collapse; width:100%; font-size:.9rem }
    th,td { text-align:left; padding:.45rem .5rem; border-bottom:1px solid #eceef1 }
    th { color:#555; font-weight:600 }
    input[type=text],input[type=number],input[type=password] {
      width:100%; padding:.5rem .6rem; border:1px solid #c9cfd6; border-radius:6px;
      font:inherit; background:#fff }
    input:focus-visible { outline:2px solid var(--blau); outline-offset:1px }
    .btn { display:inline-block; background:var(--blau); color:#fff; border:2px solid var(--blau);
           border-radius:6px; padding:.55rem 1.1rem; font:inherit; font-weight:700;
           cursor:pointer; text-decoration:none }
    .btn:hover { opacity:.88 }
    .btn--still { background:#fff; color:var(--blau) }
    .btn--warn { background:var(--rot); border-color:var(--rot) }
    .melden { padding:.65rem .9rem; border-radius:6px; margin-bottom:1rem; font-size:.92rem }
    .melden.ok { background:#e7f4e8; border:1px solid var(--gruen); color:#1c5620 }
    .melden.fehler { background:#fdeceb; border:1px solid var(--rot); color:#8c1c16 }
    .melden.hinweis { background:#eef2f7; border:1px solid var(--blau); color:#2c4460 }
    .status { display:inline-block; padding:.1rem .5rem; border-radius:999px;
              font-size:.75rem; font-weight:700; letter-spacing:.03em }
    .status.ACTIVE { background:#e7f4e8; color:#1c5620 }
    .status.EXPIRED,.status.SCHEDULED { background:#f2f3f5; color:#555 }
    .warnkasten { background:#fff8e6; border:1px solid var(--gold); border-radius:8px;
                  padding:.8rem 1rem; margin:1rem 0; font-size:.9rem }
    .diff { background:#f7f8fa; border:1px solid #e3e6ea; border-radius:8px;
            padding:.8rem 1rem; font-size:.92rem; white-space:pre-wrap }
    .paar { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-bottom:.5rem }
    @media (max-width:560px){ .paar{ grid-template-columns:1fr } }
  </style>
</head>
<body>
  <header>
    <span class="marke">Futurespin · Einstellungen</span>
    <a href="{{ url_for('index') }}">Rabatte</a>
    <a href="{{ url_for('protokoll') }}">Protokoll</a>
    <a href="{{ url_for('logout') }}">Abmelden</a>
  </header>
  <main>
    {% with meldungen = get_flashed_messages(with_categories=true) %}
      {% for art, text in meldungen %}
        <div class="melden {{ art }}">{{ text }}</div>
      {% endfor %}
    {% endwith %}
    {% block inhalt %}{% endblock %}
  </main>
</body>
</html>

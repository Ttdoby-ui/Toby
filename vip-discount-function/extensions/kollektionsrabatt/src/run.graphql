query Input(
  $collectionIds: [ID!]
  $vipTags: [String!]
  $vereinTags: [String!]
  $gruppenTags: [String!]
) {
  cart {
    # Gesetzt, wenn der Checkout im Ladengeschaeft (Shopify POS) stattfindet.
    # ACHTUNG: Feld liegt auf Cart, NICHT auf der Input-Root (gegen
    # schema.graphql verifiziert, 2026-07-04) -> POS-Ausschluss des Rabatts.
    retailLocation {
      id
    }
    buyerIdentity {
      customer {
        # Zwei getrennte Tag-Abfragen, deshalb Aliase: hasTags kann pro Aufruf
        # nur EINE Liste pruefen.
        vip: hasTags(tags: $vipTags) {
          tag
          hasTag
        }
        verein: hasTags(tags: $vereinTags) {
          tag
          hasTag
        }
      }
    }
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
        compareAtAmountPerQuantity {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            inAnyCollection(ids: $collectionIds)
            isVip: hasAnyTag(tags: ["for_vip"])
            noVolume: hasAnyTag(tags: ["kein_mengenrabatt"])
            # Warengruppen des Produkts (Belag, Holz, Textil, ...). Darueber
            # bekommt jeder Verein je Warengruppe einen eigenen Satz, ohne dass
            # dafuer Kollektionen angelegt werden muessen.
            gruppen: hasTags(tags: $gruppenTags) {
              tag
              hasTag
            }
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "kollektionsrabatt", key: "config") {
      jsonValue
    }
  }
}

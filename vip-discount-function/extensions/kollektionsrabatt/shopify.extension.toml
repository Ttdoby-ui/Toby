api_version = "2025-10"

[[extensions]]
name = "Kollektionsrabatt (Mengenstaffel)"
handle = "kollektionsrabatt"
type = "function"

[[extensions.targeting]]
target = "cart.lines.discounts.generate.run"
input_query = "src/run.graphql"
export = "run"

[extensions.build]
path = "dist/function.wasm"
# Reines JS ohne generierte Typen → typegen no-op (sonst läuft graphql-codegen
# und scheitert mangels Codegen-Konfig). Der Build bündelt + javy danach normal.
typegen_command = "node --version"

# Bindet das Konfigurations-Metafeld an die Input-Query.
# Die JSON-Felder werden dabei zu gleichnamigen Query-Variablen:
#   collectionIds -> $collectionIds
#   vipTags       -> $vipTags
#   vereinTags    -> $vereinTags     (seit 2026-08-15)
#   gruppenTags   -> $gruppenTags    (Warengruppen-Tags der Produkte)
# Neue Felder brauchen deshalb KEINE Toml-Aenderung, nur die Variable in
# run.graphql.
[extensions.input.variables]
namespace = "kollektionsrabatt"
key = "config"

name: Bundle-Bestellungen markieren

# Schreibt eine klare "📦 BUNDLE-BESTELLUNG"-Zeile in order.note fuer jede
# Bestellung, die Bundle-Bestandteile enthaelt (LineItem.lineItemGroup),
# damit der Packzettel ("Packzettel neu"-Vorlage in der Order-Printer-App)
# das ueber die bereits vorhandene Notiz-Box anzeigt. Deckt auch alte
# Bestellungen ab. IMMER zuerst dry_run=true. Idempotent (Marker-Check).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Trockenlauf (nichts schreiben, nur Report)"
        type: boolean
        default: true
      query:
        description: "Bestellungs-Suchquery (leer = alle Bestellungen)"
        required: false
        default: ""
      limit:
        description: "Max. Bestellungen (leer = alle)"
        required: false
        default: ""

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/shopify-adhesive-service-vkfNR
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten
        run: pip install requests
      - name: Bundle-Bestellungen markieren
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          QUERY: ${{ inputs.query }}
          LIMIT: ${{ inputs.limit }}
        run: python scripts/mark-bundle-orders.py

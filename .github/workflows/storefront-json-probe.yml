name: Storefront JSON Probe

# Diagnose fuer die "250-Produkte-Falle":
#  1. wie viele Produkte liefert /collections/<handle>/products.json bei
#     verschiedenen limit/page-Kombinationen?
#  2. enthaelt die ausgelieferte Konfigurator-Seite den GEFIXTEN Code?
# Aus der Claude-Session heraus ist futurespin.de nicht erreichbar
# (Sandbox-Proxy), deshalb der Umweg ueber Actions - dort ist der Egress frei.
#
# Rein lesend, keine Secrets, keine Schreibzugriffe.

on:
  workflow_dispatch:
    inputs:
      handle:
        description: 'Kollektions-Handle'
        required: true
        default: 'holzer'
      theme_id:
        description: 'Theme-ID fuer die Seiten-Vorschau'
        required: true
        default: '200523612508'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Endpunkt und Seite abklopfen
        env:
          SHOP_URL: https://futurespin.de
          HANDLE: ${{ inputs.handle }}
          THEME_ID: ${{ inputs.theme_id }}
        run: |
          node -e '
          const shop = process.env.SHOP_URL;
          const base = shop + "/collections/" + process.env.HANDLE + "/products.json";
          const varianten = ["", "?limit=250", "?limit=250&page=1", "?limit=250&page=2", "?limit=250&page=3"];

          (async () => {
            console.log("=== 1) products.json ===");
            for (const v of varianten) {
              try {
                const r = await fetch(base + v);
                const d = await r.json();
                const ps = d.products || [];
                console.log(`${(v || "(ohne Parameter)").padEnd(20)} HTTP ${r.status}  Produkte: ${String(ps.length).padEnd(4)} ${ps.length ? ps[0].title + "  ...  " + ps[ps.length-1].title : ""}`);
              } catch (e) { console.log(`${v} FEHLER ${e.message}`); }
            }

            console.log("");
            console.log("=== 2) ausgelieferte Konfigurator-Seite ===");
            const seiten = [
              shop + "/pages/schlaeger-konfigurator",
              shop + "/pages/schlaeger-konfigurator?preview_theme_id=" + process.env.THEME_ID,
            ];
            for (const u of seiten) {
              try {
                const r = await fetch(u, { redirect: "follow" });
                const html = await r.text();
                const hatFix   = html.includes("K_PAGE_SIZE");
                const hatAlt   = html.includes("rel=\\\\\"next\\\\\"") || html.includes("res.link.match");
                const hatLimit = html.includes("products.json?limit=");
                console.log(u.replace(shop, ""));
                console.log(`   HTTP ${r.status}  Laenge ${html.length}  cache-control: ${r.headers.get("cache-control")}`);
                console.log(`   Fix-Marker K_PAGE_SIZE: ${hatFix}   alter Link-Header-Code: ${hatAlt}   "products.json?limit=": ${hatLimit}`);
              } catch (e) { console.log(`${u} FEHLER ${e.message}`); }
            }
          })();
          '
